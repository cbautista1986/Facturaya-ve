name = "facturaya"  # debe ser igual al nombre del Worker en Cloudflare
main = "src/index.ts"
compatibility_date = "2025-10-20"
# Dominio propio conectado en Cloudflare (facturayave.com): mantiene *.workers.dev desactivado en cada despliegue
workers_dev = false

# El front end (carpeta public/) se sirve gratis y sin límite; el Worker solo corre para /api/*
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "facturacion_ve_db"
database_id = "1c555fec-951d-48f9-bbb4-fc54bf6c2e84"

# Base de datos aislada y efímera exclusiva para Demos de prospectos (sin clientes reales, se limpia al vencer)
[[d1_databases]]
binding = "DB_DEMO"
database_name = "facturaya_demo_db"
database_id = "e9d338be-05e8-4922-8b7c-33d14e8da116"

[observability]
enabled = true

# Turnstile anti-bots (clave pública segura para el repositorio; las claves secretas y datos de contacto van SOLO en Cloudflare -> Variables and Secrets)
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAGBXwZFePzf-zu4f"
TURNSTILE_HOSTNAMES = "facturayave.com,www.facturayave.com"
EMAIL_REMITENTE = "facturas@mail.facturayave.com"
EMAIL_NOMBRE_PLATAFORMA = "FacturaYa Venezuela"
# WHATSAPP_CONTACTO -> configurar SOLO como Secreto en Cloudflare (nunca en este archivo)
# SUPER_ADMIN_EMAIL -> configurar SOLO como Secreto en Cloudflare (nunca en este archivo)

# Sincronización automática de Tasa BCV Centralizada, Cierre Contable Mensual y Respaldo Diario + Archivo Mensual R2 (8:00 AM, 1:00 PM y 6:00 PM hora de Caracas UTC-4)
[triggers]
crons = ["0 12,17,22 * * *"]

# Respaldo automático diario (30 días) y archivo mensual fiscal (10 años) en Cloudflare R2 (bucket privado, gratis hasta 10 GB/mes):
[[r2_buckets]]
binding = "RESPALDOS_R2"
bucket_name = "facturaya-respaldos"

# Nota de privacidad multi-inquilino:
# No incluyas aquí bindings [[d1_databases]] con nombres, RIF o UUIDs de empresas clientes.
# Las bases D1 dedicadas de clientes se enlazan dinámicamente mediante el panel Multi-Tenant y los secretos de Cloudflare.
